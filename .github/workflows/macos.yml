name: macOS

# Deliberately manual: pushes, pull requests and tags do not start this workflow.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      HAVE_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        id: tools
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          VIBEZIP_XCODE_VERSION=$(xcodebuild -version | awk '/^Xcode / { print $2 }')
          VIBEZIP_SDK_VERSION=$(xcrun --sdk macosx --show-sdk-version)
          [ "${VIBEZIP_XCODE_VERSION%%.*}" -ge 26 ] || { echo '::error::VibeZip requires Xcode 26 or later.'; exit 1; }
          [ "${VIBEZIP_SDK_VERSION%%.*}" -ge 26 ] || { echo '::error::VibeZip requires the macOS 26 SDK or later.'; exit 1; }
          xcodebuild -version
          xcrun swift --version
          printf 'xcode=%s\n' "$(xcodebuild -version | awk '/^Build version / { print $3 }')" >> "$GITHUB_OUTPUT"

      - name: Check release configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ "$HAVE_DEVELOPER_ID" = true ]; then
            : "${ASC_KEY_ID:?Missing ASC_KEY_ID}" "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}" "${ASC_KEY_P8:?Missing ASC_KEY_P8}"
          fi

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            CPP/7zip/Bundles/Format7zF/b
            macOS/.build/native
            macOS/.build/swift-sandbox
            macOS/.build/swiftpm-cache
            macOS/.build/clang-module-cache
            macOS/.build/swift-module-cache
          key: vibezip-macos-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ github.sha }}
          restore-keys: |
            vibezip-macos-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-

      - name: Import signing material
        if: env.HAVE_DEVELOPER_ID == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          VIBEZIP_KEYCHAIN="$RUNNER_TEMP/vibezip-signing.keychain-db"
          VIBEZIP_KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$VIBEZIP_KEYCHAIN_PASSWORD"
          security create-keychain -p "$VIBEZIP_KEYCHAIN_PASSWORD" "$VIBEZIP_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$VIBEZIP_KEYCHAIN"
          security unlock-keychain -p "$VIBEZIP_KEYCHAIN_PASSWORD" "$VIBEZIP_KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/vibezip-cert.p12"
          security import "$RUNNER_TEMP/vibezip-cert.p12" -k "$VIBEZIP_KEYCHAIN" -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/vibezip-cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$VIBEZIP_KEYCHAIN_PASSWORD" "$VIBEZIP_KEYCHAIN" > /dev/null
          VIBEZIP_KEYCHAINS=("$VIBEZIP_KEYCHAIN")
          while IFS= read -r VIBEZIP_EXISTING_KEYCHAIN; do
            if [ -n "$VIBEZIP_EXISTING_KEYCHAIN" ] && [ "$VIBEZIP_EXISTING_KEYCHAIN" != "$VIBEZIP_KEYCHAIN" ]; then
              VIBEZIP_KEYCHAINS+=("$VIBEZIP_EXISTING_KEYCHAIN")
            fi
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "${VIBEZIP_KEYCHAINS[@]}"
          VIBEZIP_IDENTITY=$(security find-identity -v -p codesigning "$VIBEZIP_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$VIBEZIP_IDENTITY" ] || { echo '::error::No Developer ID Application identity was imported.'; exit 1; }
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/vibezip-notary.p8"
          printf 'MACOS_DEVELOPER_ID=%s\n' "$VIBEZIP_IDENTITY" >> "$GITHUB_ENV"
          printf 'MACOS_SIGNING_KEYCHAIN=%s\n' "$VIBEZIP_KEYCHAIN" >> "$GITHUB_ENV"
          printf 'ASC_KEY_PATH=%s\n' "$RUNNER_TEMP/vibezip-notary.p8" >> "$GITHUB_ENV"

      - name: Build universal app
        id: build
        run: |
          bash macOS/build.sh --universal
          VIBEZIP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :VibeZipVersion' macOS/dist/VibeZip.app/Contents/Info.plist)
          printf 'version=%s\n' "$VIBEZIP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package sandboxed DMG
        if: env.HAVE_DEVELOPER_ID == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash macOS/Scripts/package-dmg.sh --skip-build

      - name: Package unsigned app
        if: env.HAVE_DEVELOPER_ID != 'true'
        run: |
          ditto -c -k --keepParent macOS/dist/VibeZip.app "$RUNNER_TEMP/VibeZip-macOS-unsigned.zip"
          (cd "$RUNNER_TEMP" && shasum -a 256 VibeZip-macOS-unsigned.zip > VibeZip-macOS-unsigned.zip.sha256)

      - name: Keep unsigned app and checksum
        if: env.HAVE_DEVELOPER_ID != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VibeZip-macOS-unsigned
          path: |
            ${{ runner.temp }}/VibeZip-macOS-unsigned.zip
            ${{ runner.temp }}/VibeZip-macOS-unsigned.zip.sha256
          if-no-files-found: error

      - name: Keep DMG and checksum
        if: env.HAVE_DEVELOPER_ID == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VibeZip-macOS
          path: |
            macOS/dist/VibeZip-macOS.dmg
            macOS/dist/VibeZip-macOS.dmg.sha256
          if-no-files-found: error

      - name: Keep notarization diagnostics
        if: always() && env.HAVE_DEVELOPER_ID == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VibeZip-notarization-${{ github.sha }}
          path: macOS/dist/notarization*.json
          if-no-files-found: ignore

      - name: Publish release
        if: env.HAVE_DEVELOPER_ID == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VIBEZIP_VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VIBEZIP_FILES=(macOS/dist/VibeZip-macOS.dmg macOS/dist/VibeZip-macOS.dmg.sha256)
          if gh release view "$VIBEZIP_VERSION" > /dev/null 2>&1; then
            gh release upload "$VIBEZIP_VERSION" "${VIBEZIP_FILES[@]}" --clobber
          else
            VIBEZIP_FLAGS=()
            [ "$PRERELEASE" != true ] || VIBEZIP_FLAGS+=(--prerelease)
            gh release create "$VIBEZIP_VERSION" "${VIBEZIP_FILES[@]}" --target "$GITHUB_SHA" \
              --title "VibeZip $VIBEZIP_VERSION" --notes-file macOS/RELEASE-NOTES.md "${VIBEZIP_FLAGS[@]}"
          fi

      - name: Remove signing material
        if: always() && env.HAVE_DEVELOPER_ID == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/vibezip-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/vibezip-cert.p12" "$RUNNER_TEMP/vibezip-notary.p8"
